name: Deploy Development with Growth Service
on:
  push:
    branches: [develop]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to blue.flippi.ai
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: 137.184.24.201
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/blue.flippi.ai
            # Reset any local changes to avoid merge conflicts
            git reset --hard HEAD
            git clean -fd
            # Force update to match remote exactly
            git fetch origin develop
            git reset --hard origin/develop
            cd backend && npm install --production
            cd ../mobile-app && npm install && npx expo export --platform web --output-dir dist
            # Copy web assets that Expo doesn't include
            cp web-styles.css dist/ || echo "Warning: Could not copy web-styles.css"
            # Restart main services
            pm2 restart dev-backend dev-frontend || echo "Warning: Could not restart PM2 services"
            
      - name: Deploy Growth Service
        uses: appleboy/ssh-action@v0.1.5
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          host: 137.184.24.201
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: OPENAI_API_KEY
          script: |
            cd /var/www/blue.flippi.ai
            # Make script executable
            chmod +x scripts/deploy-growth-service.sh
            # Run deployment script with environment variables
            OPENAI_API_KEY="${OPENAI_API_KEY}" ./scripts/deploy-growth-service.sh
            
      - name: Verify Deployment
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: 137.184.24.201
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Check main app
            curl -f https://blue.flippi.ai || exit 1
            # Check growth service
            curl -f https://blue.flippi.ai/story || exit 1
            # Check API
            curl -f https://blue.flippi.ai/api/growth/content || exit 1
            echo "✨ Deployment successful! Growth service running at https://blue.flippi.ai/story ✨"