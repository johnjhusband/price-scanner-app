name: Deploy Development with OAuth Fix
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blue-deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: appleboy/ssh-action@v0.1.7
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          host: 137.184.24.201
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: OPENAI_API_KEY
          script_stop: true
          script: |
            set -euo pipefail
            cd /var/www/blue.flippi.ai

            # SSL
            if [ -f scripts/fix-ssl-and-growth-routes.sh ]; then bash scripts/fix-ssl-and-growth-routes.sh; fi
            if [ -f scripts/fix-blue-ssl-files.sh ]; then bash scripts/fix-blue-ssl-files.sh; fi

            # Git
            git reset --hard HEAD && git clean -fd
            git fetch origin develop && git reset --hard origin/develop

            # Shared env
            mkdir -p /var/www/shared
            [ -f /var/www/shared/.env ] || {
              printf "NODE_ENV=development\nPORT=3002\nOPENAI_API_KEY=${OPENAI_API_KEY:-missing}\n" > /var/www/shared/.env
            }

            # OAuth
            if [ -f scripts/apply-oauth-credentials.sh ]; then 
              export OPENAI_API_KEY="${OPENAI_API_KEY}"
              bash scripts/apply-oauth-credentials.sh
            else 
              (ls -la scripts/ | grep -E "oauth|auth") || true
            fi

            # Verify env (no crash if missing)
            if [ -f /var/www/shared/.env ]; then
              if grep -Eq "^(OPENAI_API_KEY|GOOGLE_CLIENT_ID)=" /var/www/shared/.env; then
                grep -E "^(OPENAI_API_KEY|GOOGLE_CLIENT_ID)=" /var/www/shared/.env | sed 's/=.*/=***hidden***/'
              else echo "WARN: required keys missing"; fi
            fi

            # Backend
            cd backend && npm ci && cd ..

            # Frontend
            cd mobile-app
            [ -f package.json ] || { echo "ERROR: mobile-app/package.json missing"; exit 1; }
            npm ci || { tail -n 50 ~/.npm/_logs/*.log || true; exit 1; }
            rm -rf dist .expo
            export NODE_OPTIONS="--max-old-space-size=4096"
            npm run build:web || exit 1
            [ -d dist ] || { echo "ERROR: dist missing"; exit 1; }
            [ -f web-styles.css ] && cp web-styles.css dist/ || echo "/* minimal */" > dist/web-styles.css
            [ -d assets ] && cp -r assets dist/ || true
            [ -f dist/index.html ] || echo "WARN: index.html missing"
            [ -d dist/_expo ] || echo "WARN: _expo missing"

            # PM2
            pm2 delete dev-backend || true
            export OPENAI_API_KEY="${OPENAI_API_KEY}"
            pm2 start /var/www/blue.flippi.ai/ecosystem.config.js --only dev-backend
            sleep 5
            pm2 describe dev-backend | grep -q online || { pm2 logs dev-backend --lines 30 --nostream; exit 1; }

            # Growth
            [ -f scripts/deploy-growth-service.sh ] && bash scripts/deploy-growth-service.sh || echo "WARN: no growth deploy script"

            # Nginx
            if [ -f infra-nginx/deploy-nginx.sh ]; then 
              bash infra-nginx/deploy-nginx.sh blue
            elif [ -f scripts/post-deploy-all-routes.sh ]; then 
              bash scripts/post-deploy-all-routes.sh blue.flippi.ai 3002
            fi
            pm2 save
            nginx -t && nginx -s reload

            # Health checks (robust curl)
            curl -fsS --retry 3 --retry-connrefused --max-time 5 http://localhost:3002/health || { pm2 status dev-backend; exit 1; }
            code=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --retry-connrefused http://localhost:3002/auth/google)
            [ "$code" = "302" ] || [ "$code" = "200" ] || exit 1
            curl -fsS --retry 3 https://blue.flippi.ai >/dev/null || exit 1
            curl -fsS --retry 3 http://localhost:3003/story >/dev/null || echo "WARN: growth service not responding"

            echo "✅ Deployment complete"